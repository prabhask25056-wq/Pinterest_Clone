{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pinterest Clone{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% if user.is_authenticated %}
    <nav class="navbar">
        <a href="{% url 'main' %}" class="brand-link" aria-label="Home">
            <img src="{% static 'images/images.png' %}" alt="Pinterest logo" class="brand-logo">
        </a>
        <a href="{% url 'main' %}" class="nav-link">Home</a>

        <form method="get" action="{% url 'main' %}" class="search-form">
            <input type="text" name="q" placeholder="Search pins">
            <button type="submit">Search</button>
        </form>

        <a href="{% url 'add' %}" class="nav-link">Create</a>

        <form method="post" action="{% url 'logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </nav>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
